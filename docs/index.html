<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co 语言文档 / Co Language Documentation</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1f; color: #e6e6e6; }
    }
    h1 { font-size: 26px; font-weight: 600; margin: 0; text-align: center; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 200px;
      height: 110px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      background: #39f;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18); }
    .card small { font-size: 13px; font-weight: 400; opacity: .85; margin-top: 6px; }
    .card.en { background: #2bb673; }
  </style>
</head>
<body>
  <h1>Co程序设计 / The Co Programming Language</h1>
  <div class="cards">
    <a class="card" href="./zh/">中文<small>Co程序设计</small></a>
    <a class="card en" href="./en/">English<small>The Co Programming Language</small></a>
  </div>
</body>
</html>
